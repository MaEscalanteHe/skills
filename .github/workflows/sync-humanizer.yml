name: Sync humanizer

# Opens a PR when blader/humanizer publishes a release newer than plugins/humanizer.
# A PR rather than a push, so upstream prompt changes are reviewed before they reach claude.ai.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: blader/humanizer
      PLUGIN: plugins/humanizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for a newer release
        id: check
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $tag" >&2; exit 1; }
          current="$(jq -r .version "$PLUGIN/.claude-plugin/plugin.json")"
          branch="sync/humanizer-$tag"
          if [[ "$(printf '%s\n' "$current" "${tag#v}" | sort -V | tail -1)" == "$current" ]]; then
            echo "humanizer $current is up to date"
          elif git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch already exists"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the release
        if: steps.check.outputs.tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          raw() { gh api "repos/$UPSTREAM/contents/$1?ref=$TAG" -H "Accept: application/vnd.github.raw"; }
          raw SKILL.md > "$PLUGIN/skills/humanizer/SKILL.md"
          raw LICENSE > "$PLUGIN/LICENSE"
          jq --arg v "${TAG#v}" '.version = $v' "$PLUGIN/.claude-plugin/plugin.json" > plugin.json.tmp
          mv plugin.json.tmp "$PLUGIN/.claude-plugin/plugin.json"
          scripts/build-marketplace.sh
          npm install --global @anthropic-ai/claude-code@2.1.306
          claude plugin validate .

      - name: Open a pull request
        if: steps.check.outputs.tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore: update humanizer to $TAG"
          git push origin "$BRANCH"
          gh pr create --title "chore: update humanizer to $TAG" --body "Release notes: https://github.com/$UPSTREAM/releases/tag/$TAG

          Review the SKILL.md diff before merging: once synced to claude.ai it becomes instructions for the agent."
